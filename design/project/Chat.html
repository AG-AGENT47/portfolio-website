<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Chat with Avyakt — AI Twin</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  :root {
    --paper: #f4ecdf;
    --paper-2: #ebe0cc;
    --ink: #1f1812;
    --ink-2: #3a2e25;
    --rust: #b34a1f;
    --rust-deep: #7a2c10;
    --peach: #e8b88a;
    --muted: #7a6a5a;
  }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    font-size: 16px; line-height: 1.55;
    overflow: hidden;
  }
  *::selection { background: var(--rust); color: var(--paper); }

  .chat-page {
    display: grid;
    grid-template-columns: 320px 1fr;
    height: 100vh;
    position: relative;
    overflow: hidden;
  }

  /* Side rail */
  .chat-rail {
    background: var(--paper-2);
    padding: 28px 28px 24px;
    display: flex; flex-direction: column;
    border-right: 1px solid rgba(31, 24, 18, 0.12);
    overflow-y: auto;
  }
  .rail-back {
    font-family: "Instrument Serif", serif;
    font-style: italic;
    font-size: 16px;
    color: var(--ink-2);
    text-decoration: none;
    margin-bottom: 32px;
  }
  .rail-back:hover { color: var(--rust); }
  .rail-mark {
    font-family: "Instrument Serif", serif;
    font-style: italic;
    font-size: 28px;
    margin-bottom: 4px;
  }
  .rail-sub {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--rust);
    text-transform: lowercase;
    margin-bottom: 32px;
  }
  .rail-block {
    margin-bottom: 28px;
  }
  .rail-h {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .rail-block p {
    font-size: 14px;
    color: var(--ink-2);
    margin: 0;
  }
  .rail-suggest {
    display: flex; flex-direction: column; gap: 6px;
  }
  .rail-suggest button {
    text-align: left;
    background: var(--paper);
    border: 1px solid rgba(31, 24, 18, 0.12);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 13px;
    color: var(--ink-2);
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
  }
  .rail-suggest button:hover { border-color: var(--rust); color: var(--rust); }

  .rail-status {
    margin-top: auto;
    padding-top: 20px;
    border-top: 1px solid rgba(31, 24, 18, 0.12);
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--muted);
    display: flex; flex-direction: column; gap: 6px;
  }
  .rail-status .row { display: flex; justify-content: space-between; }
  .rail-status .row span:first-child { letter-spacing: 0.1em; }
  .rail-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #2d8755;
    box-shadow: 0 0 0 0 rgba(45, 135, 85, 0.6);
    animation: pulse 1.6s infinite;
    display: inline-block;
    margin-right: 6px;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(45, 135, 85, 0.6); }
    100% { box-shadow: 0 0 0 10px rgba(45, 135, 85, 0); }
  }

  /* Main area */
  .chat-main {
    position: relative;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .chat-blob {
    position: absolute;
    width: 800px; height: 800px;
    right: -260px; top: -200px;
    background: radial-gradient(circle, rgba(179, 74, 31, 0.32) 0%, rgba(179, 74, 31, 0.08) 40%, transparent 70%);
    filter: blur(60px);
    border-radius: 50%;
    pointer-events: none;
    animation: drift 20s infinite ease-in-out;
  }
  .chat-blob.alt {
    width: 520px; height: 520px;
    right: auto; left: -180px; top: auto; bottom: -120px;
    background: radial-gradient(circle, rgba(31, 24, 18, 0.2) 0%, transparent 65%);
    animation-direction: reverse;
  }
  @keyframes drift {
    0%, 100% { transform: translate(0, 0); }
    50% { transform: translate(40px, 30px); }
  }

  .chat-header {
    position: relative; z-index: 2;
    padding: 20px 48px;
    border-bottom: 1px solid rgba(31, 24, 18, 0.08);
    display: flex; justify-content: space-between; align-items: center;
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    color: var(--ink-2);
  }
  .chat-header b { color: var(--ink); font-weight: 600; }
  .chat-meta {
    display: flex; gap: 24px;
    color: var(--muted);
  }

  .chat-body {
    position: relative; z-index: 2;
    flex: 1;
    overflow-y: auto;
    padding: 48px 48px 24px;
  }
  .chat-inner { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .chat-intro {
    font-family: "Instrument Serif", serif;
    font-size: 36px;
    line-height: 1.2;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-bottom: 24px;
  }
  .chat-intro em { font-style: italic; color: var(--rust-deep); }

  .msg { display: flex; gap: 12px; align-items: flex-start; }
  .msg.me { justify-content: flex-end; }
  .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    font-family: "Instrument Serif", serif;
    font-style: italic;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .avatar.ai { background: var(--ink); color: var(--paper); }
  .avatar.me { background: var(--rust); color: var(--paper); }
  .bubble {
    padding: 14px 18px;
    border-radius: 16px;
    max-width: 75%;
    font-size: 15px;
    line-height: 1.5;
  }
  .msg.ai .bubble { background: var(--paper-2); color: var(--ink); border-top-left-radius: 4px; }
  .msg.me .bubble { background: var(--ink); color: var(--paper); border-top-right-radius: 4px; }
  .bubble.thinking { display: inline-flex; gap: 4px; padding: 16px 18px; }
  .bubble.thinking span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .bubble.thinking span:nth-child(2) { animation-delay: 0.15s; }
  .bubble.thinking span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-4px); opacity: 1; }
  }

  /* Retrieval transparency chips under AI msgs */
  .retrieval {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-left: 44px;
    margin-top: -10px;
  }
  .retrieval span {
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--muted);
    background: var(--paper-2);
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid rgba(31, 24, 18, 0.1);
  }
  .retrieval span b { color: var(--rust); font-weight: 500; }

  /* Input */
  .chat-input {
    position: relative; z-index: 2;
    padding: 16px 48px 24px;
    background: linear-gradient(to top, var(--paper) 60%, rgba(244, 236, 223, 0));
  }
  .input-shell {
    max-width: 760px; margin: 0 auto;
    display: flex; gap: 8px;
    background: var(--paper-2);
    border: 1px solid rgba(31, 24, 18, 0.15);
    border-radius: 16px;
    padding: 8px 8px 8px 20px;
    align-items: center;
    transition: border-color 0.2s;
  }
  .input-shell:focus-within { border-color: var(--rust); }
  .input-shell input {
    flex: 1; border: none; background: transparent; outline: none;
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 15px;
    padding: 8px 0;
    color: var(--ink);
  }
  .input-shell button {
    width: 40px; height: 40px;
    border: none; border-radius: 12px;
    background: var(--ink); color: var(--paper);
    cursor: pointer; font-size: 16px;
  }
  .input-foot {
    max-width: 760px; margin: 8px auto 0;
    font-family: "JetBrains Mono", monospace;
    font-size: 10px;
    color: var(--muted);
    display: flex; justify-content: space-between;
  }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="shared.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// Believable retrieval chunks per topic — shows transparency
const RETRIEVAL_FOR = (q) => {
  const t = q.toLowerCase();
  if (/uber|spring|kafka/.test(t)) return [
    { src: "experience.md", score: 0.91 },
    { src: "uber-rate-card.go", score: 0.84 },
  ];
  if (/cuda|gpu|faiss|vector/.test(t)) return [
    { src: "ivfpq-notes.md", score: 0.93 },
    { src: "cuda-kernel.cu", score: 0.86 },
    { src: "sift1m-bench.txt", score: 0.78 },
  ];
  if (/photo|camera|film/.test(t)) return [
    { src: "personal.md", score: 0.88 },
  ];
  if (/research|mitacs|saskatchewan|iit/.test(t)) return [
    { src: "research-notes.md", score: 0.89 },
    { src: "postgres-redesign.sql", score: 0.81 },
  ];
  return [
    { src: "resume.md", score: 0.79 },
    { src: "about.md", score: 0.74 },
  ];
};

const SUGGESTS = [
  "What did you do at Uber?",
  "Tell me about the CUDA project.",
  "What do you shoot photography on?",
  "How can I hire you?",
  "Walk me through your RAG chatbot architecture.",
];

function ChatPage() {
  const apiStatus = useApiStatus();
  const [msgs, setMsgs] = useState([
    { who: "ai", text: "Hi — I'm Avyakt's AI twin. I'm a 3-repo Go RAG system. Ask me about projects, papers, or which lens I'd take to a Madison winter.", retrieval: null },
  ]);
  const [input, setInput] = useState("");
  const [thinking, setThinking] = useState(false);
  const logRef = useRef(null);

  useEffect(() => {
    if (logRef.current) {
      logRef.current.scrollTop = logRef.current.scrollHeight;
    }
  }, [msgs, thinking]);

  const send = (text) => {
    const t = (text ?? input).trim();
    if (!t) return;
    setMsgs(m => [...m, { who: "me", text: t }]);
    setInput("");
    setThinking(true);
    setTimeout(() => {
      setMsgs(m => [...m, {
        who: "ai",
        text: pickReply(t),
        retrieval: RETRIEVAL_FOR(t),
      }]);
      setThinking(false);
    }, 800 + Math.random() * 700);
  };

  return (
    <div className="chat-page">
      <aside className="chat-rail">
        <a href="Portfolio.html" className="rail-back">← back to portfolio</a>
        <div className="rail-mark">avyakt.</div>
        <div className="rail-sub">ai twin · v1.2.0</div>

        <div className="rail-block">
          <div className="rail-h">about</div>
          <p>This chatbot retrieves from my notes, projects, and resume. It's a real Go service in production — well, almost.</p>
        </div>

        <div className="rail-block">
          <div className="rail-h">try asking</div>
          <div className="rail-suggest">
            {SUGGESTS.map(s => (
              <button key={s} onClick={() => send(s)}>{s}</button>
            ))}
          </div>
        </div>

        <div className="rail-status">
          <div className="row"><span><span className="rail-dot" />api</span><span>{apiStatus.live ? "live" : "down"}</span></div>
          <div className="row"><span>latency</span><span>{apiStatus.latency}ms</span></div>
          <div className="row"><span>uptime</span><span>{apiStatus.uptime.toFixed(2)}%</span></div>
          <div className="row"><span>region</span><span>us-east-1</span></div>
        </div>
      </aside>

      <main className="chat-main">
        <div className="chat-blob" />
        <div className="chat-blob alt" />

        <header className="chat-header">
          <div><b>chat.avyakt.dev</b></div>
          <div className="chat-meta">
            <span>go · sse</span>
            <span>pgvector · voyage</span>
            <span>gemini + groq</span>
            <span>hyde retrieval</span>
          </div>
        </header>

        <div className="chat-body" ref={logRef}>
          <div className="chat-inner">
            <div className="chat-intro">
              Talk to me, <em>via my AI twin.</em>
            </div>
            {msgs.map((m, i) => (
              <React.Fragment key={i}>
                <div className={`msg ${m.who}`}>
                  {m.who === "ai" && <div className="avatar ai">a</div>}
                  <div className="bubble">{m.text}</div>
                  {m.who === "me" && <div className="avatar me">u</div>}
                </div>
                {m.retrieval && (
                  <div className="retrieval">
                    <span>retrieved:</span>
                    {m.retrieval.map((r, j) => (
                      <span key={j}>{r.src} · <b>{r.score.toFixed(2)}</b></span>
                    ))}
                  </div>
                )}
              </React.Fragment>
            ))}
            {thinking && (
              <div className="msg ai">
                <div className="avatar ai">a</div>
                <div className="bubble thinking"><span/><span/><span/></div>
              </div>
            )}
          </div>
        </div>

        <div className="chat-input">
          <div className="input-shell">
            <input
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={e => e.key === "Enter" && send()}
              placeholder="ask anything about my work, research, or photography…"
              autoFocus
            />
            <button onClick={() => send()}>↑</button>
          </div>
          <div className="input-foot">
            <span>responses are mocked for the demo · real backend is in go</span>
            <span>enter ↵ to send</span>
          </div>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ChatPage />);
</script>

</body>
</html>
